[project]
name = "ghostwatch-backend"
version = "0.1.0"
description = "Ghostwatch backend: event ingestion, traces, anomaly detection, investigations and replay coordination."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "anthropic>=1.0",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "ghostwatch",
    "httpx2>=2.0",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv.sources]
# The SDK is tested end to end against the real API in tests/test_sdk_e2e.py.
ghostwatch = { path = "../sdk/python", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Deprecations in our own code fail the suite instead of scrolling past.
filterwarnings = ["error"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# The formatter wraps code at the line length; what is left over is long strings, which read better whole.
ignore = ["E501"]

[tool.ruff.lint.isort]
# The local alembic/ migrations directory would otherwise make ruff treat the library as first-party.
known-third-party = ["alembic"]
